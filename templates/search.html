{% extends 'base.html' %}

{% block content %}

<h3 class="text-warning" style="letter-spacing: 2px;" > Search Term  - {{keyword}}</h3>
<div class="row mb-2">
    {% if blogs %}
    {% for i in blogs %}
    
    <div class="col-md-6">
    <div class="card border-0" >
        <div class="card-body">
        <h3> <a href="{% url 'blogs' i.slug %}"  class="text-dark" >{{ i.title}}</a> </h3>
        <small class="mb-1 text-muted"> {{i.created_at | timesince}} ago | {{i.author}}</small>
        <!-- truncatewords le dherai wards ko paragraph x vane limited words matrai dekhau x and last ma ... rakh din x  -->
        <p class="card-text"> {{i.short_description | truncatewords:35 }} </p>
        </div>
    </div>
    </div>
    {% endfor %}
    {% else %}
        <p> No Posts Found</p>
    {% endif %}
  
  </div>

{% endblock %}
