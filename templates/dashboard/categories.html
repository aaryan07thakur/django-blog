{% extends "base.html" %}

{% block content %}
<!-- left side bar -->
 <!-- load the sidebar here -->
 <div class="row">

    <!-- left side bar -->
    <!-- load the sidebar here -->

    {% include 'dashboard/sidebar.html' %}



     <!-- right side bar -->
     <div class="col-md-9">
        <h2>All Categories</h2>

        <a href="{% url 'add_category' %}" class="btn btn-dark text-light float-right mb-2"> Add New category</a>       
        <table class="table table-hover add_categproed">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Category Name</th>
                    <th>Created At</th>
                    <th>Updated At</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for cat in categories %}
                    <tr>
                        <th> {{ forloop.counter}} </th>
                            <td>{{cat}} </td>
                            <td>{{cat.created_at}}</td>
                            <td> {{cat.updated_at}} </td>
                            <td>
                                <a href=""> <i class="fa fa-edit text-seuccess"></i> </a>
                                &nbsp;
                                <a href=""> <i class="fa fa-trash text-danger "></i> </a>
                            

                            </td>
                          
                    </tr>
                {% endfor %}
                
            </tbody>
        </table>

     </div>


</div>


{% endblock %}
